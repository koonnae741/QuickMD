ShortDescription: 100% Pure Native Rust Markdown reader for Windows (144Hz GPU-free tiny-skia & cosmic-text engine, offline Knuth TeX math & Sugiyama Mermaid diagrams, zero WebView2).
Description: |-
  QuickMD 3.0 is a standalone, 100% Pure Native Rust Markdown reader powered by Tao, Softbuffer, tiny-skia, and cosmic-text for Windows 10 and 11 with zero WebView2 or browser runtime dependencies.
  Features instant cold boot, Two-Tier Progressive Layout for massive multi-megabyte documents at 144Hz, 100% offline air-gapped security, native Knuth TeX math typesetting, native Sugiyama Mermaid diagrams with interactive Pan-Zoom Lightbox, flawless ICU Thai dictionary segmentation, and 5 handcrafted reading themes.
