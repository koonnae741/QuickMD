ShortDescription: Ultra-fast, lightweight native Markdown reader for Windows (<15ms, ~25MB RAM, offline KaTeX & Mermaid). Powered by Rust + WebView2.
Description: |-
  QuickMD is a standalone, lightweight Markdown reader powered by a high-performance Rust core (Tao + Wry) paired with a modern sandboxed WebView2 rendering engine for Windows 10 and 11.
  Features instant sub-15ms cold start, ~25MB memory footprint, 100% offline air-gapped security, KaTeX math rendering, live Mermaid diagrams, and 5 eye-strain reduction themes.
