[package]
name = "doc_layout"
version = "3.0.0"
edition = "2021"
rust-version = "1.88"
description = "QuickMD 3.0 pure-Rust Markdown layout & virtual viewport engine"
license = "MIT OR Apache-2.0"

[dependencies]
pulldown-cmark = { version = "0.12", default-features = false, features = ["simd"] }
cosmic-text = "0.12"
tiny-skia = "0.11"
unicode-width = "0.2"
icu_segmenter = { version = "2.4", default-features = false, features = ["compiled_data"] }

