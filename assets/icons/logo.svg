<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0f1a" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1a183a" />
    </linearGradient>

    <!-- Metallic Rim Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.4)" />
      <stop offset="40%" stop-color="rgba(129, 140, 248, 0.6)" />
      <stop offset="80%" stop-color="rgba(56, 189, 248, 0.3)" />
      <stop offset="100%" stop-color="rgba(192, 132, 252, 0.5)" />
    </linearGradient>

    <!-- Ambient Center Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(99, 102, 241, 0.45)" />
      <stop offset="60%" stop-color="rgba(56, 189, 248, 0.15)" />
      <stop offset="100%" stop-color="rgba(12, 15, 26, 0)" />
    </radialGradient>

    <!-- Bar Gradients -->
    <!-- Stem Left: Cyan to Royal Indigo -->
    <linearGradient id="stemLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Stem Right: Soft Indigo to Electric Purple -->
    <linearGradient id="stemRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Top Crossbar: Bright Teal to Vibrant Magenta/Purple -->
    <linearGradient id="crossTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Bottom Crossbar: Blue to Neon Pink -->
    <linearGradient id="crossBottom" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- 3D Inter-layer Shadows -->
    <filter id="mainShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#020617" flood-opacity="0.85" />
    </filter>

    <filter id="barShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="32" y="32" width="448" height="448" rx="108" ry="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4.5" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="185" fill="url(#ambientGlow)" />

  <!-- Speed-Tilted Hash Mark (#) -->
  <g transform="translate(256, 256) skewX(-11.5) translate(-256, -256)" filter="url(#mainShadow)">
    <!-- 1. Bottom Crossbar -->
    <rect x="96" y="286" width="320" height="46" rx="23" fill="url(#crossBottom)" />

    <!-- 2. Vertical Stems (with shadow over bottom crossbar) -->
    <g filter="url(#barShadow)">
      <rect x="180" y="96" width="46" height="320" rx="23" fill="url(#stemLeft)" />
      <rect x="286" y="96" width="46" height="320" rx="23" fill="url(#stemRight)" />
    </g>

    <!-- 3. Top Crossbar (with shadow over vertical stems) -->
    <g filter="url(#barShadow)">
      <rect x="96" y="180" width="320" height="46" rx="23" fill="url(#crossTop)" />
    </g>
  </g>
</svg>